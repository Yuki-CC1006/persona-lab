name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock drifts from pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
